site_name: SwarmBench
site_description: A benchmark for strategic agents in the CoGNETs Swarm Arena
site_url: https://swarmbench.readthedocs.io/
repo_url: https://github.com/Indigma-Innovations/swarmbench
repo_name: Indigma-Innovations/swarmbench
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Indigma Innovations. Arena engine &copy; 2026 The CoGNETs Consortium. Apache-2.0.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

hooks:
  - docs/hooks/catalog.py

exclude_docs: |
  hooks/
  training/

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            members_order: source
            docstring_style: google
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Quickstart: quickstart.md
  - Concepts:
      - The game: game.md
      - Modes and metrics: modes.md
      - The catalog: catalog.md
      - Trained models: models.md
  - Guides:
      - Writing your own agent: custom-agents.md
      - Command line: cli.md
      - Reproducing the results: reproducing.md
  - API reference:
      - Overview: api/index.md
      - Agents: api/agent.md
      - Catalog: api/catalog.md
      - Engine and modes: api/engine.md
      - Reports and analysis: api/analysis.md
      - Arena engine: api/arena.md
      - Bots: api/bots.md
  - Project:
      - Contributing: contributing.md
      - Releasing to PyPI: releasing.md
      - Changelog: changelog.md
      - Citing: citing.md
